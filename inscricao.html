<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - UniEventos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="cabecalho">
        <h1>UniEventos</h1>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="programacao.html">Programação</a>
            <a href="inscricao.html">Inscrição</a>
        </nav>
    </header>

    <main class="pagina">
        <section class="cabecalho-pagina">
            <p class="destaque">PARTICIPE</p>
            <h1>Inscrição em evento</h1>
            <p>Preencha o formulário abaixo para simular sua inscrição em um dos eventos.</p>
        </section>

        <section class="formulario-container">
            <form>
                <div class="grupo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="grupo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="linha-form">
                    <div class="grupo">
                        <label for="curso">Curso</label>
                        <input type="text" id="curso" name="curso" placeholder="Seu curso" required>
                    </div>

                    <div class="grupo">
                        <label for="periodo">Período</label>
                        <select id="periodo" name="periodo" required>
                            <option value="">Selecione</option>
                            <option>1º período</option>
                            <option>2º período</option>
                            <option>3º período</option>
                            <option>4º período</option>
                            <option>5º período</option>
                            <option>6º período</option>
                            <option>7º período</option>
                            <option>8º período</option>
                            <option>9º período</option>
                            <option>10º período</option>
                        </select>
                    </div>
                </div>

                <div class="grupo">
                    <label for="evento">Evento desejado</label>
                    <select id="evento" name="evento" required>
                        <option value="">Selecione um evento</option>
                        <option>Inteligência Artificial no Futuro</option>
                        <option>Introdução ao Desenvolvimento Web</option>
                        <option>Inovação e Empreendedorismo</option>
                        <option>Comunicação e Oratória</option>
                        <option>Carreira e Mercado de Trabalho</option>
                        <option>Organização de Projetos</option>
                    </select>
                </div>

                <fieldset>
                    <legend>Modalidade</legend>
                    <label class="radio"><input type="radio" name="modalidade" value="presencial" required>Presencial</label>
                    <label class="radio"><input type="radio" name="modalidade" value="online" required> Online</label>
                </fieldset>

                <label class="checkbox">
                    <input type="checkbox" name="confirmacao" required>
                    Confirmo que as informações preenchidas estão corretas.
                </label>

                <button class="botao" type="submit">Realizar inscrição</button>
            </form>
        </section>
    </main>

    <footer class="rodape">
        <p>2026 Universidade Horizonte - Portal de Eventos</p>
    </footer>

</body>

</html>
